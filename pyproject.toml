[project]
name = "agent-eye"
version = "0.1.0"
description = "Screenshot feedback for coding agents — let your agent SEE what it builds (MCP server + Claude Code hook)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "lkh081231" }]
requires-python = ">=3.10"
keywords = ["mcp", "screenshot", "claude-code", "agent", "feedback", "hook"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "mss>=9.0",
    "pillow>=10.0",
    "mcp>=1.2",
]

[project.scripts]
agent-eye = "agent_eye.cli:main"
agent-eye-mcp = "agent_eye.server:main"

[project.urls]
Repository = "https://github.com/lkh081231/agent-eye"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_eye"]
